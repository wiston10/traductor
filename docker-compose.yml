services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - HOST=0.0.0.0
      - PORT=3000
      - OFFLINE_MODE=true
      - STT_MODEL_PATH=/models/es-de-whisper.bin
      - TRANSLATION_MODEL_PATH=/models/nllb-es-de.onnx
      - TTS_MODEL_PATH=/models/es-de-tts.bin
    expose:
      - "3000"
    networks:
      - app-network

  # Reverse proxy con HTTPS automático mediante Let's Encrypt / ZeroSSL
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  caddy_data:
  caddy_config:
